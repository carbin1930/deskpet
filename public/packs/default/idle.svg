<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .blink { animation: blink 4s infinite; transform-origin: 70px 96px; }
    .blink2 { animation: blink 4s infinite; transform-origin: 130px 96px; }
    .body { animation: breathe 3s ease-in-out infinite; transform-origin: 100px 170px; }
    .tail { animation: tail 2.5s ease-in-out infinite; transform-origin: 150px 160px; }
    @keyframes blink { 0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)} }
    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.02,.98)} }
    @keyframes tail { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(12deg)} }
  </style>
  <g class="body">
    <path class="tail" d="M150 160 Q185 155 178 115 Q175 100 165 105 Q172 120 158 140 Q150 150 145 155Z" fill="#818cf8"/>
    <path d="M55 175 Q50 110 100 105 Q150 110 145 175 Q100 190 55 175Z" fill="#a5b4fc"/>
    <path d="M62 90 L60 48 L92 72 Q100 70 108 72 L140 48 L138 90 Q150 110 100 118 Q50 110 62 90Z" fill="#a5b4fc"/>
    <path d="M66 84 L66 58 L86 76Z" fill="#f9a8d4"/>
    <path d="M134 84 L134 58 L114 76Z" fill="#f9a8d4"/>
    <ellipse cx="78" cy="96" rx="5" ry="7" fill="#1e293b" class="blink"/>
    <ellipse cx="122" cy="96" rx="5" ry="7" fill="#1e293b" class="blink2"/>
    <path d="M92 108 Q100 116 108 108" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M100 105 L96 102 M100 105 L104 102" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="68" cy="108" r="7" fill="#f9a8d4" opacity=".6"/>
    <circle cx="132" cy="108" r="7" fill="#f9a8d4" opacity=".6"/>
  </g>
</svg>
