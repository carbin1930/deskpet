    <ellipse cx="118" cy="177" rx="13" ry="9" fill="#f7e9c9"/>
    <ellipse cx="100" cy="88" rx="45" ry="42" fill="#d9a54a"/>
    <path d="M62 62 L50 18 Q72 32 86 52 Z" fill="#b8862f"/>
    <path d="M138 62 L150 18 Q128 32 114 52 Z" fill="#b8862f"/>
    <path d="M64 56 L56 28 Q72 38 82 52 Z" fill="#e8a878"/>
    <path d="M136 56 L144 28 Q128 38 118 52 Z" fill="#e8a878"/>
    <ellipse cx="100" cy="104" rx="30" ry="24" fill="#f7e9c9"/>
    <ellipse cx="80" cy="84" rx="5" ry="6.5" fill="#3a2a1a" class="blink"/>
    <ellipse cx="120" cy="84" rx="5" ry="6.5" fill="#3a2a1a" class="blink2"/>
    <circle cx="81.5" cy="82" r="1.6" fill="#fff"/>
    <circle cx="121.5" cy="82" r="1.6" fill="#fff"/>
    <circle cx="66" cy="100" r="6" fill="#e8a878" opacity=".55"/>
    <circle cx="134" cy="100" r="6" fill="#e8a878" opacity=".55"/>
