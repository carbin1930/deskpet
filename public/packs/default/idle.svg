    <path d="M100 102 L100 108 M100 108 Q88 118 80 108 M100 108 Q112 118 120 108" fill="none" stroke="#3a2a1a" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse class="tongue" cx="100" cy="116" rx="6" ry="8" fill="#e8899a"/>
  </g>
</svg>
