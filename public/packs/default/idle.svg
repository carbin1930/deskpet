<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .blink { animation: blink 4.5s infinite; transform-origin: 80px 84px; }
    .blink2 { animation: blink 4.5s infinite; transform-origin: 120px 84px; }
    .body { animation: breathe 3s ease-in-out infinite; transform-origin: 100px 178px; }
    .tail { animation: wag .8s ease-in-out infinite; transform-origin: 140px 152px; }
    .tongue { animation: pant 1.4s ease-in-out infinite; transform-origin: 100px 114px; }
    @keyframes blink { 0%,93%,100%{transform:scaleY(1)} 96%{transform:scaleY(.1)} }
    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.02,.99)} }
    @keyframes wag { 0%,100%{transform:rotate(-16deg)} 50%{transform:rotate(18deg)} }
    @keyframes pant { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }
  </style>
  <g class="body">
    <path class="tail" d="M138 152 Q168 148 174 112 Q177 94 167 98 Q171 122 150 142 Z" fill="#c8913f"/>
    <path d="M62 178 Q58 130 100 128 Q142 130 138 178 Q100 188 62 178Z" fill="#d9a54a"/>
