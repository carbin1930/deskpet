<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .flash { animation: flash .8s ease-in-out infinite; }
    .tremble { animation: tremble .18s linear infinite; transform-origin: 100px 140px; }
    .body { animation: breathe .6s ease-in-out infinite; transform-origin: 100px 178px; }
    .tail { animation: wag .35s ease-in-out infinite; transform-origin: 140px 152px; }
    @keyframes flash { 0%,100%{opacity:.3} 50%{opacity:.85} }
    @keyframes tremble { 0%{transform:translate(0,0)} 25%{transform:translate(-3px,1px)} 50%{transform:translate(3px,-1px)} 75%{transform:translate(-2px,-2px)} }
    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04,.97)} }
    @keyframes wag { 0%,100%{transform:rotate(-22deg)} 50%{transform:rotate(22deg)} }
  </style>
  <g class="tremble">
    <ellipse class="flash" cx="100" cy="132" rx="86" ry="76" fill="#ef4444"/>
    <g class="body">
