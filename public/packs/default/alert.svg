<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .flash { animation: flash .8s ease-in-out infinite; }
    .tremble { animation: tremble .18s linear infinite; transform-origin: 100px 140px; }
    .body { animation: breathe .6s ease-in-out infinite; transform-origin: 100px 170px; }
    @keyframes flash { 0%,100%{opacity:.35} 50%{opacity:.9} }
    @keyframes tremble { 0%{transform:translate(0,0)} 25%{transform:translate(-3px,1px)} 50%{transform:translate(3px,-1px)} 75%{transform:translate(-2px,-2px)} }
    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04,.96)} }
  </style>
  <g class="tremble">
    <ellipse class="flash" cx="100" cy="135" rx="82" ry="72" fill="#ef4444"/>
    <g class="body">
      <path d="M150 160 Q185 155 178 115 Q175 100 165 105 Q172 120 158 140 Q150 150 145 155Z" fill="#f87171"/>
      <path d="M55 175 Q50 110 100 105 Q150 110 145 175 Q100 190 55 175Z" fill="#fca5a5"/>
      <path d="M62 90 L60 48 L92 72 Q100 70 108 72 L140 48 L138 90 Q150 110 100 118 Q50 110 62 90Z" fill="#fca5a5"/>
      <path d="M66 84 L66 58 L86 76Z" fill="#f9a8d4"/>
      <path d="M134 84 L134 58 L114 76Z" fill="#f9a8d4"/>
      <path d="M70 92 L86 97 M86 92 L70 97" stroke="#450a0a" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M114 97 L130 92 M114 92 L130 97" stroke="#450a0a" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M88 114 Q100 104 112 114" fill="none" stroke="#450a0a" stroke-width="3" stroke-linecap="round"/>
      <path d="M100 108 L100 120 M94 114 L106 114" stroke="#450a0a" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
