<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .shake { animation: shake .5s ease-in-out infinite; transform-origin: 100px 140px; }
    .sweat { animation: drip 1.2s ease-in infinite; }
    .body { animation: breathe 1s ease-in-out infinite; transform-origin: 100px 170px; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2px)} 75%{transform:translateX(2px)} }
    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03,.97)} }
    @keyframes drip { 0%{transform:translateY(0);opacity:0} 30%{opacity:1} 100%{transform:translateY(22px);opacity:0} }
  </style>
  <g class="shake">
    <g class="body">
      <path d="M150 160 Q185 155 178 115 Q175 100 165 105 Q172 120 158 140 Q150 150 145 155Z" fill="#fbbf24"/>
      <path d="M55 175 Q50 110 100 105 Q150 110 145 175 Q100 190 55 175Z" fill="#fcd34d"/>
      <path d="M62 90 L60 48 L92 72 Q100 70 108 72 L140 48 L138 90 Q150 110 100 118 Q50 110 62 90Z" fill="#fcd34d"/>
      <path d="M66 84 L66 58 L86 76Z" fill="#f472b6"/>
      <path d="M134 84 L134 58 L114 76Z" fill="#f472b6"/>
      <path d="M70 94 L86 98 M86 94 L70 98" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <path d="M114 98 L130 94 M114 94 L130 98" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="100" cy="110" rx="9" ry="7" fill="#1e293b"/>
      <path class="sweat" d="M150 78 Q156 88 150 94 Q144 88 150 78Z" fill="#38bdf8"/>
      <path class="sweat" style="animation-delay:.5s" d="M158 96 Q163 104 158 109 Q153 104 158 96Z" fill="#38bdf8"/>
    </g>
  </g>
</svg>
