[package]
name = "deskpet"
version = "0.1.0"
description = "A desktop pet that reflects your system status"
authors = ["weiqi"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deskpet_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
sysinfo = "=0.33.1"
chrono = "0.4"
